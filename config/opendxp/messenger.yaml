framework:
    messenger:
        transports:
            # Override this DSN in the application to use another broker.
            opendxp_campaigns: 'doctrine://default?queue_name=opendxp_campaigns'
        routing:
            # Routing resolves through interfaces, so one entry covers every message.
            'Instride\Bundle\OpenDxpCampaignsBundle\Messenger\CampaignsMessageInterface': opendxp_campaigns
