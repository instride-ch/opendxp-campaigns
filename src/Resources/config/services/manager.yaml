services:

    # NewsletterManager is registered programmatically by the DI extension so the
    # default_list_name scalar can be injected. The interface alias is defined here.
    Instride\Bundle\OpenDxpCampaignsBundle\Newsletter\NewsletterManagerInterface:
        alias: Instride\Bundle\OpenDxpCampaignsBundle\Newsletter\NewsletterManager
        public: true

    # Shared provider→local write-back used by the webhook controller and the pull command.
    # DriverRegistry and MergeFieldMapper are registered programmatically, so reference them by id.
    Instride\Bundle\OpenDxpCampaignsBundle\Newsletter\IncomingMemberSync:
        arguments:
            $registry: '@Instride\Bundle\OpenDxpCampaignsBundle\Driver\DriverRegistry'
            $mapper: '@Instride\Bundle\OpenDxpCampaignsBundle\Newsletter\MergeFieldMapper'
            $eventDispatcher: '@Symfony\Contracts\EventDispatcher\EventDispatcherInterface'